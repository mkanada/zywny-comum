name: zywny_comum
description: "Núcleo compartilhado dos apps zywny-musicas e zywny-aprendizado: partitura, prática, MIDI, som, configurações e interface."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  sdk: ^3.13.3

# Os pacotes `packages/*` são membros deste workspace (como eram no zywny).
workspace:
  - packages/zywny_music
  - packages/zywny_course_format
  - packages/zywny_diag
  - packages/zywny_audio
  - packages/zywny_midi
  - packages/zywny_library

dependencies:
  flutter:
    sdk: flutter
  zywny_music:
    path: packages/zywny_music
  zywny_course_format:
    path: packages/zywny_course_format
  zywny_diag:
    path: packages/zywny_diag
  zywny_audio:
    path: packages/zywny_audio
  zywny_midi:
    path: packages/zywny_midi
  zywny_library:
    path: packages/zywny_library

  cupertino_icons: ^1.0.8
  file_selector: ^1.0.3
  archive: ^4.0.7
  path_provider: ^2.1.5
  ffi: ^2.1.0
  web: ^1.1.0
  verovio:
    path: ../verovio_flutter_bridge/verovio/bindings/dart
  score_bridge:
    path: score_bridge
  google_fonts: ^8.2.1
  flutter_midi_command: ^1.3.0
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.8.0
  cryptography: ^2.9.0
  yaml: ^3.1.4
  meta: ^1.19.0
  markdown: ^7.3.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_midi_command_platform_interface: ^1.3.0
  plugin_platform_interface: ^2.1.8

flutter:

  uses-material-design: true

  # As fontes são deste pacote: os apps as recebem junto com ele.
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/CormorantGaramond-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
